<!DOCTYPE html>
<html lang="en" itemscope itemtype="https://schema.org/NewsArticle">
  {% include head.html %}
  <body class="institutional-page">
    {% include navbar.html %}
    <header class="page-masthead" style="background-image: url('{{ page.featured_image | default: '/assets/img/news.webp' | relative_url }}')">
      <div class="page-masthead__veil"></div>
      <div class="container">
        <div class="row">
          <div class="col-lg-9">
            <p class="eyebrow text-white">News · {{ page.date | date: "%B %-d, %Y" }}</p>
            <h1>{{ page.title }}</h1>
          </div>
        </div>
      </div>
    </header>
    <main id="main-content" class="page-shell">
      <div class="container">
        <div class="row">
          <article class="col-xl-8 col-lg-9 editorial-content news-article">
            {{ content }}
          </article>
        </div>
      </div>
    </main>
    {% include footer.html %}
    {% include jscode.html %}
  </body>
</html>
