- value: "~135 billion"
  label: Metric tons of Antarctic ice lost per year
  context: NASA measured this annual average with the GRACE and GRACE Follow-On satellites from 2002 through 2025.
  source_name: NASA
  source_url: https://science.nasa.gov/earth/explore/earth-indicators/ice-sheets/
  verified: 2026-09-02

- value: "17.59 million km²"
  label: Antarctic sea ice at the 2026 winter maximum
  context: Estimated extent on September 14, 2026—the third-lowest annual maximum in the satellite record. The Warming and Circulation briefing also retains February's summer minimum.
  source_name: NASA and NSIDC
  source_url: https://science.nasa.gov/earth/earth-observatory/antarctic-sea-ice-grows-to-its-2026-maximum/
  verified: 2026-10-13

- value: "~26%"
  label: Increase in surface-ocean acidity
  context: The ocean has become about 26% more acidic on average over the past 250 years.
  source_name: NOAA Ocean Acidification Program
  source_url: https://oceanacidification.noaa.gov/what-is-ocean-acidification/
  verified: 2026-09-02
