# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: The Count of Krigsvold
email: count@krigsvold.org
description: >-
  The Count of Krigsvold puts an Antarctic title to work through climate
  education, research support, and evidence-led advocacy.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://krigsvold.org" # the base hostname & protocol for your site, e.g. http://example.com
port: 4002

permalink: pretty

twitter_username:
github_username: basuhoward

collections:
  posts:
    output: true
    permalink: /news/:year/:month/:day/:slug
    type: "post"
  fellows:
    output: true
    permalink: /fellows/:name/

keywords:
  - Antarctica
  - climate change
  - conservation research
  - Marie Byrd Land
  - Westarctica

paginate: 10
paginate_path: "/news/page/:num/"

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
  - scope:
      path: ""
      type: "fellows"
    values:
      layout: "fellow"

sass:
  sass_dir: assets/styles
  style: compressed
  sourcemap: never

# Build settings
plugins:
  - jekyll-feed
  - jekyll-inline-svg
  - jekyll-paginate
  - jekyll-redirect-from

svg:
  optimize: true

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

jekyll_timeago:
  depth: 1

algolia:
  application_id:       F2YSZQ2KZ4
  index_name:           krigsvold-search
  search_only_api_key:  2d8dc045127e744060be5e0aa0b74db7

cookie_consent:
  ga_id: "G-13CWX5EBQG"
  cookie_name: "cookieConsent"
  duration_days: 365
  policy_version: "1"
