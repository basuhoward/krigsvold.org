name: Verify Astro migration and content
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: content-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JEKYLL_ENV: production
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check patch whitespace
        run: git diff --check "$BASE_SHA" HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Build independent Jekyll migration baseline
        if: github.event.pull_request.base.sha == 'e92e989b6e850b3a9cd8fbb565edb7eba6d3a6f7'
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - uses: ruby/setup-ruby@v1
        if: github.event.pull_request.base.sha == 'e92e989b6e850b3a9cd8fbb565edb7eba6d3a6f7'
        with:
          ruby-version: '3.4.2'
          bundler-cache: true
      - name: Compare every legacy page and working reference
        if: github.event.pull_request.base.sha == 'e92e989b6e850b3a9cd8fbb565edb7eba6d3a6f7'
        run: |
          git worktree add --detach "$RUNNER_TEMP/krigsvold-base" "$BASE_SHA"
          bundle exec jekyll build --source "$RUNNER_TEMP/krigsvold-base" --config "$RUNNER_TEMP/krigsvold-base/_config.yml" --destination "$RUNNER_TEMP/krigsvold-base-site"
          python3 scripts/compare-jekyll.py "$RUNNER_TEMP/krigsvold-base-site" dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro-review-evidence
          path: artifacts/
          retention-days: 7
