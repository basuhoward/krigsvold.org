name: Verify Astro content
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: content-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check patch whitespace
        run: git diff --check "$BASE_SHA" HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
        id: validation
      - run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() && steps.validation.outcome == 'success' }}
      - run: npm run test:browser
        if: ${{ !cancelled() && steps.validation.outcome == 'success' }}
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro-review-evidence
          path: artifacts/
          retention-days: 7
